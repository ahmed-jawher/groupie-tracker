<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupie Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            --primary-color: #1a1a2e;
            --secondary-color: #4ecca3;
            --background-color: #0f0f1a;
            --card-background: #16213e;
            --text-color: #e1e1e1;
            --accent-color: #ff2e63;
            --transition-speed: 0.4s;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1a1a2e 0%, #0f0f1a 100%);
        }

        h1 {
            text-align: center;
            padding: 2.5rem;
            margin: 0;
            font-size: 3.5rem;
            color: var(--text-color);
            position: relative;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 700;
            animation: fadeInDown 1s ease;
            text-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
        }

        h1::before {
            content: '';
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 2px;
            
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 3px;
            background: var(--accent-color);
            border-radius: 2px;
            animation: glowLine 2s infinite;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
            animation: fadeIn 1s ease;
            max-width: 1400px;
            margin: 0 auto;
            perspective: 1000px;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
                padding: 1rem;
            }
            h1 {
                font-size: 2.5rem;
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 0.8rem;
            }
            h1 {
                font-size: 2rem;
                padding: 1rem;
            }
        }

        a {
            text-decoration: none;
            color: var(--text-color);
        }

        .card {
            background-color: var(--card-background);
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            transform-origin: center;
            animation: cardAppear 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            transform-style: preserve-3d;
        }

        .grid-container:hover .card:not(:hover) {
            transform: scale(0.9);
            filter: brightness(0.8);
        }

        .card:hover {
            transform: scale(1.1) translateZ(20px);
            box-shadow: 0 20px 40px rgba(78, 204, 163, 0.3);
            border-color: var(--secondary-color);
            z-index: 1;
            filter: brightness(1.1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, 
                rgba(26, 26, 46, 0) 0%,
                rgba(26, 26, 46, 0.8) 50%,
                var(--primary-color) 100%);
            opacity: 0;
            transition: opacity var(--transition-speed);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform var(--transition-speed);
        }

        .card:hover img {
            transform: scale(1.15);
        }

        .card h3 {
            padding: 1.2rem;
            margin: 0;
            font-size: 1.3rem;
            color: var(--text-color);
            text-align: center;
            font-weight: 600;
            position: relative;
            background: var(--card-background);
            transition: all var(--transition-speed);
        }

        .card:hover h3 {
            color: var(--secondary-color);
            text-shadow: 0 0 10px rgba(78, 204, 163, 0.5);
        }

        @keyframes glowLine {
            0%, 100% {
                box-shadow: 0 0 5px var(--accent-color),
                            0 0 15px var(--accent-color);
            }
            50% {
                box-shadow: 0 0 20px var(--accent-color),
                            0 0 30px var(--accent-color);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <h1>Groupie Tracker</h1>
    <div class="grid-container">
        {{range .}}
        <a href="/artists/{{.ID}}">
            <div class="card">
                <img src="{{.Image}}" alt="{{.Name}}">
                <h3>{{.Name}}</h3>
            </div>
        </a>
        {{end}}
    </div>
</body>

</html>
