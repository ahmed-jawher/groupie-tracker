<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Code}} - {{.Title}}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            --primary-color: #1a1a2e;
            --secondary-color: #4ecca3;
            --background-color: #0f0f1a;
            --card-background: #16213e;
            --text-color: #e1e1e1;
            --accent-color: #ff2e63;
            --transition-speed: 0.4s;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top right, #1a1a2e 0%, #0f0f1a 100%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 3rem;
            background-color: var(--card-background);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(78, 204, 163, 0.1);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease;
        }

        .error-code {
            font-size: 8rem;
            margin: 0;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(255, 46, 99, 0.5);
            font-weight: 700;
            line-height: 1;
            animation: pulse 2s infinite;
        }

        .error-title {
            font-size: 2rem;
            margin: 1rem 0;
            color: var(--secondary-color);
            font-weight: 600;
            animation: slideUp 0.8s ease;
        }

        .error-message {
            font-size: 1.2rem;
            margin: 1.5rem 0;
            color: var(--text-color);
            animation: slideUp 0.8s ease;
            opacity: 0.9;
        }

        .home-button {
            display: inline-block;
            text-decoration: none;
            color: var(--secondary-color);
            font-weight: 600;
            transition: all var(--transition-speed);
            padding: 0.8rem 2rem;
            border: 2px solid var(--secondary-color);
            border-radius: 30px;
            margin-top: 1rem;
        }

        .home-button:hover {
            background: var(--secondary-color);
            color: var(--background-color);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(78, 204, 163, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                text-shadow: 0 0 20px rgba(255, 46, 99, 0.5);
            }
            50% {
                text-shadow: 0 0 30px rgba(255, 46, 99, 0.8);
            }
            100% {
                text-shadow: 0 0 20px rgba(255, 46, 99, 0.5);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="error-code">{{.Code}}</h1>
        <h2 class="error-title">{{.Title}}</h2>
        <p class="error-message">{{.Message}}</p>
        <a href="/" class="home-button">Return to Homepage</a>
    </div>
</body>

</html>
